name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  wheel:
    # Tests the built package, so missing data files in the wheel fail CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl pytest pytest-asyncio
      - run: cp -r tests /tmp/tests && cd /tmp && /tmp/v/bin/python -I -m pytest -q /tmp/tests -p no:cacheprovider
