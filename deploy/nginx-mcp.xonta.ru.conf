# Add inside the existing `server { server_name mcp.xonta.ru; ... }` block.
# The MCP endpoint becomes https://mcp.xonta.ru/customs/mcp

location /customs/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
}

# The server card is at https://mcp.xonta.ru/customs/.well-known/mcp/server-card.json.
# Don't map it to the domain root: mcp.xonta.ru already serves another MCP server.
